name: Images

# Builds the production images on main, pushes them to GitHub Container
# Registry and pins the new tags in deploy/k8s, which Argo CD then rolls out.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: dwc-api
            dockerfile: apps/api/Dockerfile
          - name: dwc-web
            dockerfile: apps/web/Dockerfile
          - name: dwc-backoffice
            dockerfile: apps/backoffice/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ricardofernandes99/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/ricardofernandes99/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  pin:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin image tags for Argo CD
        run: |
          sed -i -E "s/^(    newTag: ).*/\1${GITHUB_SHA}/" deploy/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: roll out images ${GITHUB_SHA::7}"
          git push
