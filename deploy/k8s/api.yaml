# NestJS API with a HorizontalPodAutoscaler. Configuration comes from the
# `dwc-config` ConfigMap and `dwc-secrets` Secret created by the bootstrap
# script (they hold host names and generated secrets, so they are not in Git).
apiVersion: v1
kind: Service
metadata:
  name: api
  annotations:
    # socket.io starts with HTTP long-polling, so a client must keep hitting the
    # same pod until it upgrades to WebSocket. Traefik pins it with a cookie.
    traefik.ingress.kubernetes.io/service.sticky.cookie: 'true'
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: dwc_api_affinity
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: 'true'
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # No replica count: the HPA owns it (and Argo CD must not fight the HPA).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # Creates the private product-images bucket if it is missing (idempotent).
        - name: storage-init
          image: ghcr.io/ricardofernandes99/dwc-api:latest
          command: ['node', 'scripts/storage-init.ts']
          envFrom:
            - configMapRef: { name: dwc-config }
            - secretRef: { name: dwc-secrets }
      containers:
        - name: api
          image: ghcr.io/ricardofernandes99/dwc-api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: dwc-config }
            - secretRef: { name: dwc-secrets }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          # CPU requests are what the HPA percentage is measured against.
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
