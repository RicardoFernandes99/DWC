apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dwc
resources:
  - namespace.yaml
  - data.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - seed.yaml
# CI replaces these tags with the commit SHA it built, so Argo CD rolls out
# exactly the images that match the manifests in Git.
images:
  - name: ghcr.io/ricardofernandes99/dwc-api
    newTag: ca62ce8a1cc0d5417bdf32934b1cb92dbf0f71f2
  - name: ghcr.io/ricardofernandes99/dwc-web
    newTag: ca62ce8a1cc0d5417bdf32934b1cb92dbf0f71f2
  - name: ghcr.io/ricardofernandes99/dwc-backoffice
    newTag: ca62ce8a1cc0d5417bdf32934b1cb92dbf0f71f2
