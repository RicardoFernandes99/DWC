# Demo data. Runs after every successful Argo CD sync; the fixture command is
# idempotent ("already exists, no changes"), so later syncs leave data alone.
# It is opted in to the in-cluster `mongodb` host only, and the demo password
# comes from the `dwc-secrets` Secret (FIXTURE_PASSWORD).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo-data
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: seed
          image: ghcr.io/ricardofernandes99/dwc-api:latest
          command: ['node', 'dist/local-demo-fixtures.js', '--create']
          envFrom:
            - configMapRef: { name: dwc-config }
            - secretRef: { name: dwc-secrets }
          env:
            - name: FIXTURE_ALLOWED_MONGODB_HOST
              value: mongodb
            - name: FIXTURE_MAINTENANCE_ACK
              value: stopped
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
