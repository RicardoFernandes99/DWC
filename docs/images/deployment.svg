<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Deployment on a single Azure VM with k3s and Argo CD</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6770"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="16" fill="#fafaf7"/>

  <text x="40" y="58" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7a848c">DELIVERY</text>
  <text x="40" y="308" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7a848c">RUNTIME</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#e1e4e7"/>
  <line x1="40" y1="318" x2="1160" y2="318" stroke="#e1e4e7"/>

  <!-- delivery -->
  <g fill="#fff" stroke="#c9ced3" stroke-width="1.5">
    <rect x="40" y="110" width="140" height="64" rx="10"/>
    <rect x="240" y="110" width="140" height="64" rx="10"/>
    <rect x="440" y="110" width="170" height="64" rx="10"/>
    <rect x="680" y="110" width="220" height="64" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#2b3137">
    <text x="110" y="148">Developer</text>
    <text x="310" y="136">GitHub</text>
    <text x="525" y="136">GitHub Actions</text>
    <text x="790" y="136">GitHub Container Registry</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#6b747b">
    <text x="310" y="156">main · deploy/k8s</text>
    <text x="525" y="156">build · push · pin tag</text>
    <text x="790" y="156">api · web · backoffice images</text>
  </g>

  <g fill="none" stroke="#5b6770" stroke-width="1.8" marker-end="url(#a)">
    <path d="M180 142H240"/>
    <path d="M380 142H440"/>
    <path d="M610 142H680"/>
    <path d="M470 174V200H330V174"/>
  </g>
  <g font-size="12" fill="#5b6770">
    <text x="196" y="134">push</text>
    <text x="388" y="134">on main</text>
    <text x="624" y="134">push</text>
    <text x="346" y="218">commits the new image tag</text>
  </g>

  <!-- dashed: argo pull and image pull -->
  <g fill="none" stroke="#5b6770" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)">
    <path d="M270 174V520H340"/>
    <path d="M900 142H940V365"/>
  </g>
  <g font-size="12" fill="#5b6770">
    <text x="280" y="262">Argo CD pulls</text>
    <text x="280" y="278">deploy/k8s</text>
    <text x="950" y="250">pods pull images</text>
  </g>

  <!-- users -->
  <rect x="40" y="401" width="170" height="44" rx="10" fill="#fff" stroke="#c9ced3" stroke-width="1.5"/>
  <text x="125" y="429" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3137">Users</text>
  <path d="M210 423H340" fill="none" stroke="#5b6770" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="220" y="415" font-size="12" fill="#5b6770">HTTP</text>

  <!-- VM and k3s -->
  <rect x="300" y="330" width="860" height="360" rx="16" fill="#f3f6fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="320" y="352" font-size="13" font-weight="700" fill="#1d4577">Azure VM · Ubuntu 24.04</text>
  <rect x="320" y="365" width="820" height="305" rx="14" fill="#f4f8f4" stroke="#3b7a47" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1124" y="386" text-anchor="end" font-size="13" font-weight="700" fill="#2f6b3a">k3s</text>

  <rect x="340" y="395" width="780" height="46" rx="10" fill="#fff" stroke="#3b7a47" stroke-width="1.5"/>
  <text x="730" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4d29">Traefik ingress</text>
  <text x="730" y="432" text-anchor="middle" font-size="12" fill="#3f6c49">plain HTTP · dwc, admin, s3 and argocd hosts on &lt;ip&gt;.nip.io</text>

  <!-- row B -->
  <rect x="340" y="480" width="160" height="80" rx="12" fill="#f1ecfa" stroke="#6b4fa8" stroke-width="1.5"/>
  <g fill="#e8f3e9" stroke="#3b7a47" stroke-width="1.5">
    <rect x="530" y="480" width="160" height="80" rx="12"/>
    <rect x="720" y="480" width="190" height="80" rx="12"/>
    <rect x="940" y="480" width="180" height="80" rx="12"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="700">
    <text x="420" y="513" fill="#43307a">Argo CD</text>
    <g fill="#1f4d29">
      <text x="610" y="513">Web</text>
      <text x="815" y="513">API</text>
      <text x="1030" y="513">Backoffice</text>
    </g>
  </g>
  <g text-anchor="middle" font-size="12">
    <g fill="#6a5a98">
      <text x="420" y="533">syncs the manifests</text>
      <text x="420" y="549">auto sync · self-heal</text>
    </g>
    <g fill="#3f6c49">
      <text x="610" y="533">static files</text>
      <text x="610" y="549">1 pod</text>
      <text x="815" y="533">NestJS · Socket.IO</text>
      <text x="815" y="549">2–5 pods, autoscaled</text>
      <text x="1030" y="533">Laravel Octane</text>
      <text x="1030" y="549">1 pod</text>
    </g>
  </g>

  <g fill="none" stroke="#5b6770" stroke-width="1.8" marker-end="url(#a)">
    <path d="M420 441V480"/>
    <path d="M610 441V480"/>
    <path d="M815 441V480"/>
    <path d="M1030 441V480"/>
    <path d="M940 520H910"/>
  </g>

  <!-- row C -->
  <rect x="340" y="598" width="160" height="60" rx="10" fill="#fff" stroke="#c9ced3" stroke-width="1.5"/>
  <g fill="#e8f3e9" stroke="#3b7a47" stroke-width="1.5">
    <rect x="530" y="598" width="160" height="60" rx="10"/>
    <rect x="720" y="598" width="190" height="60" rx="10"/>
    <rect x="940" y="598" width="180" height="60" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700">
    <text x="420" y="624" fill="#2b3137">K8s Secrets</text>
    <g fill="#1f4d29">
      <text x="610" y="624">MongoDB</text>
      <text x="815" y="624">Redis</text>
      <text x="1030" y="624">S3 storage</text>
    </g>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="420" y="643" fill="#6b747b">from bootstrap.sh</text>
    <g fill="#3f6c49">
      <text x="610" y="643">replica set · 10 Gi</text>
      <text x="815" y="643">sessions · Socket.IO</text>
      <text x="1030" y="643">Floci · 5 Gi</text>
    </g>
  </g>
  <g fill="none" stroke="#5b6770" stroke-width="1.8" marker-end="url(#a)">
    <path d="M815 560V579H610V598"/>
    <path d="M815 560V598"/>
    <path d="M815 560V579H1030V598"/>
  </g>
  <text x="340" y="684" font-size="12" fill="#7a848c">Everything runs inside the VM; data lives on local-path volumes. No managed Azure services.</text>
</svg>
